services:
  postgres:
    image: postgres:16-alpine
    container_name: wordforge-postgres
    restart: always
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-wordforge}
      POSTGRES_USER: ${DATABASE_USER:-wordforge_user}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-wordforge_pass}
    ports:
      - "${DATABASE_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-wordforge_user} -d ${DATABASE_NAME:-wordforge}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
