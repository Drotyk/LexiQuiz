name: WordForge CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-build:
    name: Build, Lint & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wordforge_user
          POSTGRES_PASSWORD: wordforge_pass
          POSTGRES_DB: wordforge
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Set Environment Variables
        run: |
          echo "NODE_ENV=test" >> $GITHUB_ENV
          echo "JWT_ACCESS_SECRET=ci_jwt_access_secret_super_key_12345" >> $GITHUB_ENV
          echo "JWT_REFRESH_SECRET=ci_jwt_refresh_secret_super_key_67890" >> $GITHUB_ENV
          echo "DATABASE_HOST=localhost" >> $GITHUB_ENV
          echo "DATABASE_PORT=5433" >> $GITHUB_ENV
          echo "DATABASE_USER=wordforge_user" >> $GITHUB_ENV
          echo "DATABASE_PASSWORD=wordforge_pass" >> $GITHUB_ENV
          echo "DATABASE_NAME=wordforge" >> $GITHUB_ENV

      - name: Run Typecheck
        run: npm run typecheck

      - name: Run ESLint
        run: npm run lint

      - name: Run Unit Tests
        run: npm run test

      - name: Run E2E Integration Tests
        run: npm run test:e2e --workspace=apps/backend

      - name: Run Production Build
        run: npm run build
